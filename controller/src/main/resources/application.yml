server:
  tomcat:
    uri-encoding: UTF-8
    max-swallow-size: -1    #不限制请求体的大小

spring:
  profiles:
    active: dev   #dev开发环境 prod生产环境 test测试环境
  servlet:
    multipart:
      max-file-size: 20MB    #文件上传的大小限制（支持PDF和Word，适当增大）
      max-request-size: 20MB   #文件最大请求限制，可用于批量上传
  data:
    redis:
      host: localhost
      port: 7379
      database: 2
#      password: 123456
      client-type: jedis
  # --- 智谱AI (ChatGLM) 配置 ---
  ai:
    analysis: 500
    zhipuai:
      api-key: f4f7dd3ad4764770af1a811966f79196.OeQ0WqfMTsF7t5Gx
      chat:
        options:
          model: GLM-4.5

    #dashscope 配置已禁用，统一使用智谱AI
    dashscope:
      api-key: sk-4c3dccedff144b1d96b3b2f4d79fa0fb
      chat:
      options:
      model: qwen-flash
      embedding:
      enabled: false
    vectorstore:
      # 使用Redis向量存储
      redis:
        initialize-schema: true
        # Redis 向量存储使用的索引名称
        index-name: ai-interviewer-rag
        # Redis 向量存储使用的 Key 的前缀
        prefix: ai-interviewer
        # Spring AI 会自动使用顶层的 spring.data.redis 配置 (host, port, password)
  autoconfigure:
    exclude:
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiImageAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
  rabbitmq:
    host: localhost
    port: 25672
    username: admin
    password: 123456
    virtual-host: /
    listener:
      simple:
        # 【关键】禁用默认的"重新入队"
        # false: 发生异常时，消息被拒绝(rejected)，从而进入DLQ
        # true: (默认) 发生异常时，消息被重新放回原队列，导致无限重试
        default-requeue-rejected: false
        # 【推荐】配置您的消费者并发（如我们之前讨论的）
        concurrency: 300
        max-concurrency: 400
        prefetch: 1
        acknowledge-mode: manual
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

#日志级别
logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG
#    root: info

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      banner: false
      update-strategy: not_empty
  mapper-locations: classpath*:/mapper/*.xml

# 分页插件助手的配置
pagehelper:
  helper-dialect: MYSQL
  support-methods-arguments: true

axle:
  frontend:
    domain: http://127.0.0.1:5774


minio:
  endpoint: http://127.0.0.1:9000 # 这是MinIO服务器的地址和端口
  fileHost: http://192.168.0.101:9000  # 如果你需要一个公共URL来访问上传的文件，可以在这里设置  (内网地址)
  bucketName: ai-interviewer # 你的MinIO存储桶名称
  accessKey: PxPjLOW41h5WYFPYvcU3 # MinIO的访问密钥
  secretKey: aPJCoRGW6cU8mqH1kAAbGz8UnspA4TPqW0v14yxi # MinIO的秘密密钥