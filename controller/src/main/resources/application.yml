server:
  tomcat:
    uri-encoding: UTF-8
    max-swallow-size: -1    #不限制请求体的大小

spring:
  profiles:
    active: dev   #dev开发环境 prod生产环境 test测试环境
  servlet:
    multipart:
      max-file-size: 10MB    #文件上传的大小限制
      max-request-size: 10MB   #文件最大请求限制，可用于批量上传
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
#      password: 123456
      client-type: jedis
  # --- 智谱AI (ChatGLM) 配置 ---
  ai:
    zhipuai:
      chat:
        # 必须: 填入您的 ZhipuAI API Key
        api-key: 9c4abd249a4e4a88960a6cefaba23f32.jbo8CSjOHc0OhMxZ
        # 可选: 配置模型
        options:
          # 我们使用 GLM-4 Flash，与您之前的代码一致
          model: glm-4.5-x
    dashscope:
      api-key: sk-d695e84730564a2299373e3c3be618c0
      chat:
        options:
          model: qwen-plus-latest-plus
      embedding:
        enabled: false
    vectorstore:
      redis:
        initialize-schema: true
        index-name: "custom-index"
        prefix: "custom-prefix:"
  autoconfigure:
    exclude:
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.zhipuai.autoconfigure.ZhiPuAiImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      -
  rabbitmq:
    host: 192.168.0.101
    port: 15674
    username: admin
    password: admin
    virtual-host: /AI
    listener:
      simple:
        # 【关键】禁用默认的"重新入队"
        # false: 发生异常时，消息被拒绝(rejected)，从而进入DLQ
        # true: (默认) 发生异常时，消息被重新放回原队列，导致无限重试
        default-requeue-rejected: false
        # 【推荐】配置您的消费者并发（如我们之前讨论的）
        concurrency: 100
        max-concurrency: 200
        prefetch: 200
        acknowledge-mode: manual
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

    # ... 您已有的 mybatis-plus, pagehelper, axle, minio, logging 配置 ...
    # --- 向量存储配置 (使用 Redis) ---

#      redis:
#        initialize-schema: true
#        # Redis 向量存储使用的索引名称
#        index: ai-interviewer-rag
#        # Redis 向量存储使用的 Key 的前缀
#        prefix: ai-interviewer
#        # Spring AI 会自动使用顶层的 spring.data.redis 配置 (host, port, password)
#        # 所以您无需在这里重复配置连接信息
# 注意:
# 您在 application.yml 中已有的 spring.data.redis 配置会被自动用于 Redis 向量存储
# spring.data.redis:
#   host: localhost
#   port: 6379
#   database: 1
#   password: 123456
#日志级别
logging:
  level:
    org.springframework.boot.autoconfigure: DEBUG
#    root: info

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      banner: false
      update-strategy: not_empty
  mapper-locations: classpath*:/mapper/*.xml

# 分页插件助手的配置
pagehelper:
  helper-dialect: MYSQL
  support-methods-arguments: true

axle:
  frontend:
    domain: http://127.0.0.1:5774


minio:
  endpoint: http://127.0.0.1:9000 # 这是MinIO服务器的地址和端口
  fileHost: http://192.168.0.101:9000  # 如果你需要一个公共URL来访问上传的文件，可以在这里设置  (内网地址)
  bucketName: ai-interviewer # 你的MinIO存储桶名称
  accessKey: PxPjLOW41h5WYFPYvcU3 # MinIO的访问密钥
  secretKey: aPJCoRGW6cU8mqH1kAAbGz8UnspA4TPqW0v14yxi # MinIO的秘密密钥